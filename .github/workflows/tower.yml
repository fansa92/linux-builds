name: Build Tower

on:
  workflow_dispatch:
  # 手动触发
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "Release"
      tags:
        description: '指定 tower 版本号（如 v1.0.0 或 latest）'
        required: true
        default: '1.0.0'
        
permissions:
  contents: write   # 必须有，才能创建 release
  
jobs:
  build-ios:
    name: Build iOS App (No Signing)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: pengchujin/tower
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode.app"
      - name: Build iOS target
        run: |
          xcodebuild -list
          xcodebuild \
          -project "Tower.xcodeproj" \
          -scheme "Tower" \
          -configuration ${{ github.event.inputs.build_type }} \
          -destination "generic/platform=iOS" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          SKIP_INSTALL=NO \
          archive \
          -archivePath build/ios/Tower.xcarchive
          
      - name: Export app and zip
        run: |
          mkdir -p Payload
          cp -r build/ios/Tower.xcarchive/Products/Applications/*.app Payload
          zip -r "Tower-ios-${{ github.event.inputs.tags }}.ipa" Payload/
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: Orange-Cloud-${{ github.event.inputs.tags }}
      #     path: "apps/ios/Orange Cloud/Orange-Cloud-${{ github.event.inputs.tags }}.ipa"
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Tower-${{ github.event.inputs.tags }}"
          name: "Tower-${{ github.event.inputs.tags }}"
          files: |
            *.ipa
          # draft: false
          # prerelease: false
