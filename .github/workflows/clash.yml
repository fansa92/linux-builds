name: Clash Build and Release

# 只保留手动触发
# 默认组合: Client 提交 3b8ea95e (main, 2026-10-21) + 内核 SDK a5cb38da。
# 内核 SDK 的下载顺序 (workflow 的 Fetch 步骤):
#   1. 优先 ProjectClash/Clash 的 Actions: 按 Client 锁定的内核 revision 找
#      最近一次成功的 CI run, 下载它编译好的 SDK-Release artifact
#      (需要仓库 secret CLASH_ACTIONS_TOKEN; artifact 有保留期, 可能过期)。
#   2. 回退本仓库镜像 Release (sdk_tag): a5cb38da 的 SDK 已验明五切片
#      sourceRevision 并镜像在 tag kernel-sdk-a5cb38da。
# 无论哪个来源, 都会做 SHA256 + 逐切片 sourceRevision 校验, 与 lock 的内核
# revision 不一致直接失败。
# 注: 更早的 Client 提交 899c69a7 源码本身不一致 (扩展 target 漏列源文件),
# 不要再往回钉。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.9, 留空则读取上游 project.yml 的 MARKETING_VERSION)'
        required: false
        default: ''
      ref:
        description: 'ProjectClash/Clash-Client 的 ref (其锁定内核决定下载哪份 SDK)'
        required: false
        default: '3b8ea95eff7cdfd817608fdba8079f4b03013148'
      kernel_run_id:
        description: '指定 ProjectClash/Clash 的 CI run id 下载内核 (留空则按锁定 revision 自动找最近成功 run)'
        required: false
        default: ''
      sdk_tag:
        description: '回退用的本仓库镜像内核 SDK Release tag'
        required: false
        default: 'kernel-sdk-a5cb38da'

permissions:
  contents: write # 必须有, 才能创建 Release

env:
  GOTOOLCHAIN: auto

jobs:
  prepare:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - name: Checkout ProjectClash/Clash-Client
        uses: actions/checkout@v4
        with:
          repository: ProjectClash/Clash-Client
          ref: ${{ github.event.inputs.ref }}

      - name: Determine version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^[[:space:]]*MARKETING_VERSION:' apple/ClashClient/project.yml | head -1 | awk '{print $2}' | tr -d "'\"")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION ($(git rev-parse --short HEAD))"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    # 上游要求 Xcode 27+ (JSContextGroupSetExecutionTimeLimit 等 JavaScriptCore
    # C API 只在 27 的 SDK 里对 Swift 可见, Xcode 26.6 编 JSCEngine.swift 会报
    # cannot find in scope)。GitHub 的 xcode-27 镜像 (macOS 27 + Xcode 27,
    # arm64) 2026-10-15 已 GA, 专用它, 不要用 macos-latest (最高只有 26.6)。
    runs-on: xcode-27
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: ClashiOS
            destination: 'generic/platform=iOS'
          - platform: tvOS
            scheme: ClashtvOS
            destination: 'generic/platform=tvOS'
          - platform: macOS
            scheme: ClashmacOS
            destination: 'platform=macOS'

    steps:
      - name: Checkout ProjectClash/Clash-Client
        uses: actions/checkout@v4
        with:
          repository: ProjectClash/Clash-Client
          ref: ${{ github.event.inputs.ref }}

      # xcode-27 镜像只带 Xcode 27, 无需再挑版本, 打印出来备查
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      # Go 不再用于编译内核 (内核改用预置 SDK); configure.py 仍会用 Go 编一个
      # 很小的 clash-cli 辅助程序, 这是保留 setup-go 的唯一原因。
      - name: Set up Go (only for the clash-cli helper)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      # 替代 scripts/bootstrap.py: 不再 clone 内核 + gomobile 从源码编 SDK。
      # 内核 SDK 下载顺序: 先 ProjectClash/Clash Actions 编译好的 artifact,
      # 失败/过期再回退本仓库镜像 Release (见文件头)。两个来源之后都做
      # SHA256 校验, 并逐切片核对 BuildInfo 的 sourceRevision 与
      # Dependencies.lock.json 锁定的内核 revision 完全一致。
      # Adapter 部分仍按 bootstrap.py 的做法, 按 lock 的 revision 拉源码放进 Vendor/。
      - name: Fetch prebuilt SDK and Adapter sources
        env:
          ACTIONS_TOKEN: ${{ secrets.CLASH_ACTIONS_TOKEN }}
          KERNEL_RUN_ID: ${{ github.event.inputs.kernel_run_id }}
        run: |
          set -euo pipefail
          SDK_TAG="${{ github.event.inputs.sdk_tag }}"
          WORK=".build/prebuilt-sdk"
          rm -rf "$WORK" Clash.xcframework Vendor/ClashAdapter
          mkdir -p "$WORK"
          KERNEL_REV=$(python3 -c "import json; print(json.load(open('Dependencies.lock.json'))['kernel']['revision'])")
          echo "Locked kernel revision: $KERNEL_REV"
          GOT_SDK=""

          # 1) 优先: ProjectClash/Clash Actions 里编译好的 SDK-Release artifact
          if [ -n "${ACTIONS_TOKEN:-}" ]; then
            RUN_ID="${KERNEL_RUN_ID:-}"
            if [ -z "$RUN_ID" ]; then
              RUN_ID=$(curl -sf -H "Authorization: Bearer $ACTIONS_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/ProjectClash/Clash/actions/workflows/380224600/runs?status=success&per_page=50" \
                | python3 -c "import json, sys; runs = json.load(sys.stdin)['workflow_runs']; print(next((str(r['id']) for r in runs if r['head_sha'] == '$KERNEL_REV'), ''))" || true)
            fi
            echo "Clash CI run for kernel: ${RUN_ID:-not found}"
            if [ -n "$RUN_ID" ] && GH_TOKEN="$ACTIONS_TOKEN" gh run download "$RUN_ID" --repo ProjectClash/Clash --name SDK-Release --dir "$WORK/actions"; then
              if [ -f "$WORK/actions/Clash.xcframework.zip" ] && [ -f "$WORK/actions/SHA256SUMS" ]; then
                cp "$WORK/actions/Clash.xcframework.zip" "$WORK/actions/SHA256SUMS" "$WORK/"
                GOT_SDK="actions (ProjectClash/Clash run $RUN_ID)"
              fi
            fi
          else
            echo "CLASH_ACTIONS_TOKEN not set, skipping Actions download"
          fi

          # 2) 回退: 本仓库镜像 Release
          if [ -z "$GOT_SDK" ]; then
            curl -fL --retry 3 --retry-delay 2 \
              -o "$WORK/Clash.xcframework.zip" \
              "https://github.com/${{ github.repository }}/releases/download/${SDK_TAG}/Clash.xcframework.zip"
            curl -fL --retry 3 --retry-delay 2 \
              -o "$WORK/SHA256SUMS" \
              "https://github.com/${{ github.repository }}/releases/download/${SDK_TAG}/SHA256SUMS"
            GOT_SDK="mirror release $SDK_TAG"
          fi
          echo "Kernel SDK source: $GOT_SDK"

          (cd "$WORK" && grep '  Clash.xcframework.zip$' SHA256SUMS | shasum -a 256 -c -)

          mkdir -p "$WORK/extract"
          ditto -x -k "$WORK/Clash.xcframework.zip" "$WORK/extract"
          test -d "$WORK/extract/Clash.xcframework"
          mv "$WORK/extract/Clash.xcframework" Clash.xcframework

          python3 - <<'PY'
          import json
          import plistlib
          from pathlib import Path

          root = Path('.')
          lock = json.loads((root / 'Dependencies.lock.json').read_text())
          expected_kernel = lock['kernel']['revision']
          framework = root / 'Clash.xcframework'
          info = plistlib.loads((framework / 'Info.plist').read_bytes())
          libraries = info.get('AvailableLibraries', [])
          actual = {(x['SupportedPlatform'], x.get('SupportedPlatformVariant', '')) for x in libraries}
          expected = {('ios', ''), ('ios', 'simulator'), ('tvos', ''), ('tvos', 'simulator'), ('macos', '')}
          if actual != expected:
              raise SystemExit(f'Unexpected SDK slices: {actual} != {expected}')
          for library in libraries:
              identifier = library['LibraryIdentifier']
              build_info_path = framework / identifier / 'Clash.framework/Versions/A/Resources/ClashBuildInfo.json'
              build_info = json.loads(build_info_path.read_text())
              if build_info.get('sourceRevision') != expected_kernel:
                  raise SystemExit(
                      f"SDK slice {identifier} sourceRevision {build_info.get('sourceRevision')} "
                      f"does not match locked kernel {expected_kernel}; "
                      'choose an sdk_tag built from the locked kernel revision'
                  )
              if build_info.get('sourceDirty') or build_info.get('debugBuild') or build_info.get('internalDiagnostics'):
                  raise SystemExit(f'SDK slice {identifier} is not a clean release build: {build_info}')
          print(f'Prebuilt SDK verified against locked kernel {expected_kernel}')
          PY

          ADAPTER_REPO=$(python3 -c "import json; print(json.load(open('Dependencies.lock.json'))['adapter']['repository'])")
          ADAPTER_REV=$(python3 -c "import json; print(json.load(open('Dependencies.lock.json'))['adapter']['revision'])")
          git clone "$ADAPTER_REPO" "$WORK/adapter"
          git -C "$WORK/adapter" fetch origin "$ADAPTER_REV"
          git -C "$WORK/adapter" checkout --detach "$ADAPTER_REV"
          mkdir -p Vendor/ClashAdapter/Sources/ClashAdapter
          cp "$WORK/adapter"/Sources/ClashAdapter/*.swift Vendor/ClashAdapter/Sources/ClashAdapter/
          cp "$WORK/adapter/LICENSE" Vendor/ClashAdapter/LICENSE
          ls -R Vendor/ClashAdapter

      # configure.py 只做 XcodeGen 生成工程 + 编 clash-cli 小工具, 不编内核
      - name: Configure
        run: |
          python3 -m venv .build/python-env
          source .build/python-env/bin/activate
          python3 -m pip install PyYAML
          python3 scripts/configure.py

      - name: Build (unsigned archive)
        run: |
          xcodebuild \
            -project apple/ClashClient/ClashClient.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -archivePath "build/${{ matrix.scheme }}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package
        id: pack
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          APP=$(ls -d build/*.xcarchive/Products/Applications/*.app | head -1)
          echo "Packing: $APP"
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            OUT="Clash-macOS-${VERSION}.zip"
            ditto -c -k --keepParent "$APP" "$OUT"
          else
            OUT="Clash-${{ matrix.platform }}-${VERSION}.ipa"
            rm -rf Payload && mkdir Payload
            cp -R "$APP" Payload/
            zip -qry "$OUT" Payload
          fi
          ls -lh "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-${{ matrix.platform }}
          path: ${{ steps.pack.outputs.file }}

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Clash-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clash-${{ needs.prepare.outputs.version }}
          name: clash-${{ needs.prepare.outputs.version }}
          body: |
            ## clash-${{ needs.prepare.outputs.version }}

            ProjectClash/Clash-Client 多端不签名编译 (iOS / tvOS / macOS)。

            - **Source:** ProjectClash/Clash-Client @ `${{ needs.prepare.outputs.sha }}` (ref: `${{ github.event.inputs.ref }}`)
            - **Kernel SDK:** 本仓库镜像 Release `${{ github.event.inputs.sdk_tag }}` 的预置 `Clash.xcframework.zip` (源自 ProjectClash/Clash CI, SHA256 已校验, 切片 sourceRevision 与 Client 的 Dependencies.lock.json 锁定内核一致)
            - **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            > 未签名构建 (`CODE_SIGNING_ALLOWED=NO`)。装到真机前需用自己的证书重签; macOS 版首次打开需绕过 Gatekeeper。
          draft: false
          prerelease: false
          files: |
            Clash-*.ipa
            Clash-*.zip
